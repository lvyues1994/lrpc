syntax = "proto3";
package demo;
import "payload.proto";
message EchoRequest {
  bytes payload = 1;
  optional int32 marker = 2;
  repeated int32 numbers = 3;
}
message EchoReply { bytes payload = 1; }
service Echo {
  rpc RoundTrip(EchoRequest) returns (EchoReply);
  rpc Required(test.messages.Container.Item) returns (test.messages.Container.Item);
  rpc delete(EchoRequest) returns (EchoReply);
}
service Empty {}
service Mixed {
  rpc Unary(EchoRequest) returns(EchoReply);
  rpc Upload(stream EchoRequest) returns(EchoReply);
  rpc Download(EchoRequest) returns(stream EchoReply);
  rpc Chat(stream EchoRequest) returns(stream EchoReply);
}
// A method may share its name with the generated namespace-scope function.
service Shadow { rpc Shadow_bindings(EchoRequest) returns(EchoReply); }
